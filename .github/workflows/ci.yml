name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    env:
      # NEXT_PUBLIC_* are inlined at build time; CI only checks that the build succeeds.
      NEXT_PUBLIC_API_URL: http://localhost:7100
      NEXT_PUBLIC_SITE_URL: https://thought-expense.nafiziqbal.com
      # No SENTRY_AUTH_TOKEN here, so the build skips source-map upload.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    name: Build on VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and build client on VPS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /var/www/personal/thoughtExpense/thought-expense-client
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            pnpm install --frozen-lockfile
            pnpm build
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart thought-client
            else
              echo "Build finished. Start with: pm2 restart thought-client"
            fi
